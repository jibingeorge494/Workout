<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Jibin Daniel’s Workout Plan</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: black training log — sticky day tabs; Block 1 warm-up, then one block per exercise with per-set Start/Finish rows; day totals at the end; live status bar fixed at the bottom */
:root{
  --bg:#000;
  --panel:#0f1011;
  --panel-2:#17181a;
  --line:#26282b;
  --fg:#f2f0ea;
  --muted:#96948d;
  --dim:#5b5a56;
  --accent:#f4b63c;
  --accent-dim:#7d6026;
  --done:#4cc781;
  --warn:#e58a6b;
  --display:"Barlow Condensed","Arial Narrow",Impact,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 calc(130px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:760px;margin:0 auto}
button{font:inherit}

header{padding-block:28px 18px;display:grid;gap:14px}
.eyebrow{font-family:var(--display);font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-size:.85rem}
h1{font-family:var(--display);font-weight:800;font-size:clamp(2.4rem,9vw,3.6rem);line-height:.95;margin:0;text-transform:uppercase;text-wrap:balance}
.weekbar{display:grid;gap:6px}
.weekbar .meta{display:flex;justify-content:space-between;gap:12px;color:var(--muted);font-size:.9rem;font-variant-numeric:tabular-nums}
.track{height:8px;background:var(--panel-2);border-radius:99px;overflow:hidden}
.fill{height:100%;width:0;background:var(--accent);border-radius:99px;transition:width .35s ease}

nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:10px;margin-inline:-4px;
  display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:5px;border-bottom:1px solid var(--line)}
.tab.st b{font-size:1rem}
.tab{appearance:none;border:1px solid var(--line);background:var(--panel);color:var(--muted);border-radius:10px;padding:8px 2px 7px;
  font-family:var(--display);cursor:pointer;display:grid;gap:1px;justify-items:center;min-width:0}
.tab b{font-size:1.15rem;font-weight:700;letter-spacing:.06em;color:var(--fg)}
.tab span{font-size:.78rem;font-variant-numeric:tabular-nums;letter-spacing:.04em}
.tab[aria-selected="true"]{border-color:var(--accent);background:#1a1508}
.tab[aria-selected="true"] b{color:var(--accent)}
.tab.complete span{color:var(--done)}
.tab:focus-visible,.sbtn:focus-visible,.fig:focus-visible,.reset:focus-visible,.redo:focus-visible,.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.dayhead{padding-block:22px 6px;display:grid;gap:4px}
.dayhead h2{font-family:var(--display);font-weight:800;font-size:2rem;line-height:1;margin:0;text-transform:uppercase}
.dayhead h2 em{font-style:normal;color:var(--accent)}

.list{display:grid;gap:14px;margin-top:14px}
.ex{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:grid}
.ex.done{border-color:#24533a}
.ex.live{border-color:var(--accent-dim)}
.block{font-family:var(--display);font-weight:700;font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
.fig{position:relative;background:#070708;border-bottom:1px solid var(--line);cursor:pointer;display:flex;justify-content:center}
.fig svg{width:100%;max-width:340px;height:auto;display:block}
.fig .hint{position:absolute;right:10px;bottom:8px;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);font-family:var(--display)}
.fig .tag{position:absolute;left:10px;top:8px;font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);font-family:var(--display);font-weight:700}
.info{padding:14px 16px 16px;display:grid;gap:12px;min-width:0}
.titlerow{display:flex;align-items:baseline;justify-content:space-between;gap:4px 12px;flex-wrap:wrap}
.titlerow h3{font-family:var(--display);font-weight:700;font-size:1.45rem;line-height:1.1;margin:0;text-transform:uppercase;letter-spacing:.02em}
.sr{font-family:var(--display);font-weight:700;font-size:1.25rem;color:var(--accent);font-variant-numeric:tabular-nums;white-space:nowrap}
.cues{margin:0;padding-left:1.3em;display:grid;gap:4px;color:#d9d6ce;font-size:.98rem}
.cues li::marker{color:var(--accent);font-family:var(--display);font-weight:700}
.avoid{margin:0;font-size:.92rem;color:var(--muted)}
.avoid b{color:var(--warn);font-weight:600}

/* set rows */
.setlist{display:grid;gap:8px}
.setrow{display:flex;align-items:center;gap:10px;min-height:54px;padding:6px 6px 6px 12px;border:1px solid var(--line);border-radius:12px;background:var(--panel-2)}
.setrow .nm{font-family:var(--display);font-weight:700;font-size:1.08rem;letter-spacing:.04em;display:flex;align-items:center;gap:8px;flex:none;min-width:84px}
.box{width:22px;height:22px;border-radius:50%;border:2px solid var(--dim);display:grid;place-items:center;flex:none}
.box svg{width:14px;height:14px;opacity:0}
.setrow .tm{flex:1;min-width:0;font-size:.9rem;color:var(--muted);font-variant-numeric:tabular-nums;line-height:1.3}
.tm b{color:var(--fg);font-weight:600}
.setrow.run{border-color:var(--done);background:#0f2419}
.setrow.run .tm b{color:var(--done);font-size:1.15rem;font-family:var(--display);font-weight:700}
.setrow.run .box{border-color:var(--done)}
.setrow.done .box{background:var(--done);border-color:var(--done)}
.setrow.done .box svg{opacity:1}
.setrow.rst .tm .r{color:var(--accent)}
.sbtn{appearance:none;border:none;height:42px;min-width:92px;padding:0 14px;border-radius:10px;cursor:pointer;flex:none;
  font-family:var(--display);font-weight:700;font-size:1rem;letter-spacing:.06em;text-transform:uppercase;background:var(--accent);color:#000}
.sbtn.fin{background:var(--done)}
.exsum{display:flex;flex-wrap:wrap;align-items:center;gap:6px 16px;border-top:1px dashed var(--line);padding-top:10px;font-size:.95rem;color:var(--muted);font-variant-numeric:tabular-nums}
.exsum b{color:var(--fg);font-weight:600}
.exsum .w b{color:var(--done)}
.exsum .rr b{color:var(--accent)}
.redo{margin-left:auto;appearance:none;background:none;border:1px solid var(--line);color:var(--muted);border-radius:8px;padding:4px 10px;font-size:.82rem;cursor:pointer}
.redo.confirm{border-color:var(--warn);color:var(--warn)}

/* warm-up block */
.warmline{margin:0;color:#d9d6ce}
.focus{display:grid;gap:6px}
.focus .lbl{font-family:var(--display);font-size:.78rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.focus ul{margin:0;padding:0;list-style:none;display:grid;gap:6px}
.focus li{display:grid;grid-template-columns:minmax(0,9.5rem) minmax(0,1fr);gap:2px 12px;padding:8px 10px;border-radius:10px;background:var(--panel-2);font-size:.94rem}
.focus li b{font-weight:600}
.focus.main li b{color:var(--accent)}
.focus li span{color:#cfccc4}
@media (max-width:440px){.focus li{grid-template-columns:1fr}}

/* muscle map */
.mus{display:flex;gap:14px;align-items:center;background:var(--panel-2);border-radius:12px;padding:10px 12px}
.body{width:116px;flex:none;height:auto}
.bb{fill:#1b1c1f}
.m0{fill:#2a2c30}
.ms{fill:var(--accent-dim)}
.mp{fill:var(--accent)}
.body text{fill:var(--dim);font-size:7px;text-anchor:middle;font-family:var(--display);letter-spacing:.12em}
.chips{display:flex;flex-wrap:wrap;gap:6px;min-width:0;align-content:center}
.chips .lbl{width:100%;font-family:var(--display);font-size:.75rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.chips .lbl b{color:var(--accent);font-weight:700}
.chip{font-size:.82rem;line-height:1.3;padding:3px 9px;border-radius:99px;font-weight:600}
.chip.p{background:var(--accent);color:#000}
.chip.s{border:1px solid var(--accent-dim);color:var(--accent)}

/* day totals */
.totals{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:14px}
.totals h3{font-family:var(--display);font-weight:800;font-size:1.5rem;margin:0;text-transform:uppercase}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.stat{background:var(--panel-2);border-radius:12px;padding:10px 12px;display:grid}
.stat span{font-family:var(--display);font-size:.78rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.stat b{font-family:var(--display);font-weight:800;font-size:1.8rem;font-variant-numeric:tabular-nums;line-height:1.1}
.stat.w b{color:var(--done)} .stat.r b{color:var(--accent)}
.tblwrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.92rem;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:7px 6px;border-bottom:1px solid var(--line)}
th{font-family:var(--display);font-weight:700;letter-spacing:.1em;text-transform:uppercase;font-size:.75rem;color:var(--muted)}
td.n,th.n{text-align:right;white-space:nowrap}
tfoot td{font-weight:600;border-bottom:none}

/* statistics */
.status{font-size:.95rem;color:var(--muted)}
.status b{color:var(--done);font-weight:600}
.stats.six{grid-template-columns:repeat(2,minmax(0,1fr))}
@media (min-width:600px){.stats.six{grid-template-columns:repeat(3,minmax(0,1fr))}}
.stat small{font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}
.stat small.up{color:var(--done)} .stat small.down{color:var(--warn)}
.chart{display:grid;gap:10px}
.crow{display:grid;grid-template-columns:2.6rem minmax(0,1fr) 4.2rem;align-items:center;gap:10px;font-variant-numeric:tabular-nums}
.crow .d{font-family:var(--display);font-weight:700;letter-spacing:.06em}
.crow .t{text-align:right;font-size:.92rem}
.stack{display:flex;height:20px;background:var(--panel-2);border-radius:6px;overflow:hidden}
.stack i{display:block;height:100%}
.seg-w{background:var(--done)} .seg-r{background:var(--accent)} .seg-u{background:#55545a}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:.85rem;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.hl{margin:0;padding:0;list-style:none;display:grid;gap:6px}
.hl li{display:flex;justify-content:space-between;gap:12px;padding:9px 12px;background:var(--panel-2);border-radius:10px;font-size:.95rem}
.hl li span{color:var(--muted)}
.hl li b{font-weight:600;text-align:right;font-variant-numeric:tabular-nums}
.mrow{display:grid;grid-template-columns:minmax(0,9rem) minmax(0,1fr) 3.4rem;align-items:center;gap:10px;font-size:.92rem;font-variant-numeric:tabular-nums}
.mrow .t{text-align:right;color:var(--muted)}
.mbar{height:10px;background:var(--panel-2);border-radius:99px;overflow:hidden}
.mbar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.empty{color:var(--muted);font-size:.95rem;margin:0}

/* editable plan name */
.titlebox{display:grid;gap:8px;justify-items:start}
.editname{appearance:none;display:inline-flex;align-items:center;gap:6px;background:none;border:1px solid var(--line);color:var(--muted);border-radius:8px;padding:5px 10px;font-size:.82rem;cursor:pointer}
.editname svg{width:14px;height:14px}
.editname:focus-visible,#nameInput:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.nameform{display:grid;gap:8px}
.nameform label{font-family:var(--display);font-size:.78rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
#nameInput{width:100%;background:var(--panel-2);border:1px solid var(--line);color:var(--fg);border-radius:10px;height:48px;padding:0 12px;font-family:var(--display);font-weight:700;font-size:1.4rem;text-transform:uppercase}
.nameactions{display:flex;flex-wrap:wrap;gap:8px}

footer{margin-top:28px;display:grid;gap:14px;color:var(--muted);font-size:.92rem}
.note{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--panel)}
.note b{color:var(--fg)}
.reset{justify-self:start;appearance:none;background:none;border:1px solid var(--line);color:var(--muted);border-radius:10px;padding:10px 14px;font-size:.9rem;cursor:pointer}
.reset.confirm{border-color:var(--warn);color:var(--warn)}

/* live status bar */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(8,8,9,.97);border-top:1px solid var(--line);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:10px calc(10px + env(safe-area-inset-bottom,0px))}
.barin{max-width:760px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:10px}
.clock{display:grid;line-height:1.1;min-width:0}
.lbl2{font-family:var(--display);font-size:.74rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.big{font-family:var(--display);font-weight:800;font-size:1.9rem;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.next{font-size:.82rem;color:var(--muted);overflow-wrap:anywhere}
.bar.working .big{color:var(--done)}
.bar.resting .big{color:var(--accent)}
.btns{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;flex:none;max-width:60%}
.btn{appearance:none;border:1px solid var(--line);background:var(--panel-2);color:var(--fg);border-radius:10px;height:44px;padding:0 14px;
  font-family:var(--display);font-weight:700;font-size:1rem;letter-spacing:.06em;text-transform:uppercase;cursor:pointer}
.btn.primary{background:var(--accent);color:#000;border-color:var(--accent)}
.btn.fin{background:var(--done);color:#000;border-color:var(--done)}

/* figure strokes */
.limb{stroke:var(--fg);stroke-width:6;stroke-linecap:round;fill:none}
.limb.far{stroke:var(--dim)}
.torso{stroke-width:9}
.headc{fill:var(--fg)}
.eq{stroke:#3e4147;stroke-width:3;stroke-linecap:round;fill:none}
.eqpad{stroke:#2b2e33;stroke-width:9;stroke-linecap:round;fill:none}
.eqf{fill:#1c1e22;stroke:#33363c;stroke-width:1.5}
.floor{stroke:#24262a;stroke-width:2}
.cable{stroke:var(--muted);stroke-width:1.3;fill:none}
.wt{fill:var(--accent)}
.wt.fw{fill:var(--accent-dim)}
.padc{fill:#33363c;stroke:#50535a;stroke-width:1.5}
.ghost{opacity:.22}
@media (prefers-reduced-motion:reduce){.fill{transition:none}}
</style>

<div class="wrap">
  <header>
    <div class="eyebrow">Monday – Friday · Sets × Reps</div>
    <h1>Jibin Daniel’s Workout Plan</h1>
    <div class="weekbar">
      <div class="meta"><span id="weekLabel">This week</span><span id="weekCount">0 / 0 sets</span></div>
      <div class="track"><div class="fill" id="weekFill"></div></div>
    </div>
  </header>

  <nav id="tabs" role="tablist" aria-label="Days"></nav>

  <main id="day"></main>

  <footer>
    <div class="note"><b>Training note:</b> Choose loads that let you complete each set with controlled technique. Stop if an exercise causes pain.</div>
    <button class="reset" id="reset" type="button">Clear this week's records</button>
  </footer>
</div>

<div class="bar" id="bar">
  <div class="barin">
    <div class="clock"><span class="lbl2" id="bLbl">Ready</span><span class="big" id="bTime">0:00</span><span class="next" id="bNext"></span></div>
    <div class="btns"><button class="btn" id="bAlt" type="button" hidden></button><button class="btn primary" id="bMain" type="button" hidden></button></div>
  </div>
</div>

<script>
/* ---------- Figure library (stick-figure form guides) ---------- */
const FRONT_LEGS={p:[100,84],h1:[94,86],h2:[106,86],k1:[93,112],f1:[92,140],k2:[107,112],f2:[108,140]};
const STAND_SIDE={h:[101,30],n:[100,42],p:[100,84],k1:[100,112],f1:[101,140],t1:[110,140]};
const CABLE_POST_R='<rect x="141" y="4" width="10" height="137" class="eqf"/><circle cx="141" cy="12" r="4" class="eq"/>';
const SEAT_MACHINE='<line x1="64" y1="52" x2="68" y2="98" class="eqpad"/><line x1="68" y1="100" x2="112" y2="100" class="eqpad"/><line x1="90" y1="104" x2="90" y2="141" class="eq"/>';

const FIGS={
  bench:{tag:"Lie flat",
    eq:'<rect x="46" y="96" width="94" height="6" rx="2" class="eqf"/><line x1="58" y1="102" x2="58" y2="141" class="eq"/><line x1="128" y1="102" x2="128" y2="141" class="eq"/>',
    A:{h:[57,86],n:[70,91],p:[115,91],k1:[136,98],f1:[140,138],t1:[149,139],e1:[77,102],w1:[78,80]},
    B:{e1:[71,68],w1:[72,46]},
    items:[{t:'db',at:'w2',far:1},{t:'db',at:'w1'}]},
  incline:{tag:"Bench 30–45°",
    eq:'<line x1="61" y1="58" x2="85" y2="103" class="eqpad"/><line x1="84" y1="107" x2="118" y2="107" class="eqpad"/><line x1="100" y1="111" x2="100" y2="141" class="eq"/>',
    A:{h:[62,46],n:[68,58],p:[92,100],k1:[120,100],f1:[122,138],t1:[131,139],e1:[64,75],w1:[74,57]},
    B:{e1:[80,40],w1:[90,22]},
    items:[{t:'db',at:'w2',far:1},{t:'db',at:'w1'}]},
  lateral:{tag:"Front view",front:1,
    A:{...FRONT_LEGS,h:[100,28],n:[100,40],s1:[88,44],s2:[112,44],e1:[86,64],w1:[87,84],e2:[114,64],w2:[113,84]},
    B:{e1:[68,46],w1:[48,48],e2:[132,46],w2:[152,48]},
    items:[{t:'db',at:'w1'},{t:'db',at:'w2'}]},
  pushdown:{tag:"Elbows pinned",
    eq:CABLE_POST_R,
    A:{h:[100,32],n:[98,44],p:[95,86],k1:[96,113],f1:[97,140],t1:[106,140],e1:[101,66],w1:[121,53]},
    B:{w1:[105,88]},
    items:[{t:'cable',at:'w1',to:[141,12]},{t:'bar',at:'w1'}]},
  legext:{tag:"Straighten legs",
    eq:SEAT_MACHINE+'<circle cx="112" cy="97" r="3" class="eq"/>',
    A:{h:[79,40],n:[78,52],p:[84,94],k1:[112,94],f1:[114,126],t1:[122,129],e1:[82,72],w1:[92,92]},
    B:{f1:[142,92],t1:[146,84]},
    items:[{t:'lever',at:'f1',to:[112,97],o:[5,-3]},{t:'pad',at:'f1',o:[5,-3]},{t:'grip',at:'w1'}]},
  seatcurl:{tag:"Curl heels back",
    eq:SEAT_MACHINE+'<line x1="92" y1="85" x2="114" y2="85" class="eqpad"/>',
    A:{h:[79,40],n:[78,52],p:[84,94],k1:[112,94],f1:[142,92],t1:[146,84],e1:[82,72],w1:[92,92]},
    B:{f1:[106,125],t1:[114,129]},
    items:[{t:'pad',at:'f1',o:[-2,6]},{t:'grip',at:'w1'}]},
  hip:{tag:"Front view",front:1,
    eq:'<rect x="82" y="36" width="36" height="58" rx="6" class="eqf"/><rect x="72" y="93" width="56" height="7" rx="2" class="eqf"/><line x1="100" y1="100" x2="100" y2="141" class="eq"/>',
    A:{h:[100,30],n:[100,42],s1:[88,46],s2:[112,46],p:[100,88],h1:[94,90],h2:[106,90],e1:[84,68],w1:[80,88],e2:[116,68],w2:[120,88],k1:[94,102],f1:[93,134],k2:[106,102],f2:[107,134]},
    B:{k1:[78,100],f1:[74,134],k2:[122,100],f2:[126,134]},
    items:[{t:'pad',at:'k1',o:[-7,0]},{t:'pad',at:'k2',o:[7,0]}]},

let S={rec:{},A:null};

  if(t==='w') return W(a,now);
  if(t==='r') return R(a,now);
  if(t==='exw'||t==='exr'){ const [dd,i]=a.split('.'); const d=dayById(dd); return exKeys(d,+i).reduce((s,x)=>s+(t==='exw'?W(x,now):R(x,now)),0); }

  const work=dayKeys(d).reduce((s,x)=>s+W(x,now),0);
  const rest=dayKeys(d).reduce((s,x)=>s+R(x,now),0)+R(wk(a),now);
  const warm=W(wk(a),now);
  if(t==='dw') return work; if(t==='dr') return rest; if(t==='dwarm') return warm; if(t==='dt') return work+rest+warm;
  return 0;
}
function fmt(ms){
  const t=Math.max(0,Math.floor(ms/1000)), h=Math.floor(t/3600), m=Math.floor(t%3600/60), s=t%60;

function addRec(key,f,ms){ S.rec[key]=S.rec[key]||{w:0,r:0}; S.rec[key][f]+=Math.max(0,ms); }
function closeActive(now){
  if(!S.A) return;
  if(S.A.type==='rest') addRec(S.A.from,'r',now-S.A.start); else addRec(S.A.key,'w',now-S.A.start);
  S.A=null;
}
function nextSet(dayId){
  const d=dayById(dayId); if(!d) return null;
  if(!isDone(wk(dayId)) && !(S.A&&S.A.key===wk(dayId))) return {warm:true};
  for(let i=0;i<d.ex.length;i++) for(let s=0;s<d.ex[i].sets;s++){const key=k(dayId,i,s); if(!isDone(key)&&!(S.A&&S.A.key===key)) return {i,s,e:d.ex[i],key};}
  return null;
}
const setName=n=>n.warm?'Warm-up':(n.e.sets>1?`Set ${n.s+1} of ${n.e.sets} · ${n.e.n}`:n.e.n);
function startWork(key){
  const now=Date.now(); closeActive(now);

}
function finishWork(key){
  if(!(S.A&&S.A.type==='work'&&S.A.key===key)) return;
  const now=Date.now(); const day=S.A.day; closeActive(now);
  const n=nextSet(day);
  // rest starts automatically after every set / warm-up, unless the day is finished
  if(n&&!n.warm) S.A={type:'rest',from:key,start:now,day};
  save(); if(!S.A) keepAwake(false); refresh();
}
function stopRest(){ if(S.A&&S.A.type==='rest'){ closeActive(Date.now()); save(); keepAwake(false); refresh(); } }

/* ---------- Statistics ---------- */
function weekStats(rec,A,now){
  const Wg=key=>(rec[key]?.w||0)+(A&&A.type==='work'&&A.key===key?now-A.start:0);
  const Rg=key=>(rec[key]?.r||0)+(A&&A.type==='rest'&&A.from===key?now-A.start:0);
  const doneg=key=>(rec[key]?.w||0)>0;
  const out={days:[],work:0,rest:0,warm:0,total:0,sets:0,planned:0,daysDone:0,setWorks:[],setRests:[],muscles:{}};
  DAYS.forEach(d=>{
    const ks=dayKeys(d);
    const work=ks.reduce((s,x)=>s+Wg(x),0), rest=ks.reduce((s,x)=>s+Rg(x),0)+Rg(wk(d.id)), warm=Wg(wk(d.id));
    const sets=ks.filter(doneg).length;
    out.days.push({d,work,rest,warm,total:work+rest+warm,sets,planned:ks.length});
    out.work+=work; out.rest+=rest; out.warm+=warm; out.sets+=sets; out.planned+=ks.length;
    if(sets===ks.length) out.daysDone++;
    d.ex.forEach((e,i)=>{ const m=MUSCLES[e.n]||{p:[]};
      exKeys(d,i).forEach(x=>{
        m.p.forEach(mu=>{ out.muscles[mu]=out.muscles[mu]||{done:0,planned:0}; out.muscles[mu].planned++; if(doneg(x)) out.muscles[mu].done++; });
        if(doneg(x)) out.setWorks.push(Wg(x));
        const r=Rg(x); if(r>0) out.setRests.push(r);
      });
    });
  });
  out.total=out.work+out.rest+out.warm;
  return out;
}
function prevWeekRec(){

  try{ const v=JSON.parse(localStorage.getItem('wp2-'+p.getFullYear()+'-'+(p.getMonth()+1)+'-'+p.getDate())||'null'); return v&&v.rec?v.rec:null; }catch(e){ return null; }
}
const avg=a=>a.length?a.reduce((s,x)=>s+x,0)/a.length:0;
function delta(cur,prev){
  if(prev==null||prev===0) return '';
  const d=cur-prev; if(Math.abs(d)<1000) return '<small>Same as last week</small>';
  return `<small class="${d>0?'up':'down'}">${d>0?'+':'−'}${fmt(Math.abs(d))} vs last week</small>`;
}

    </section>
  </div>`;
  figs=[];
